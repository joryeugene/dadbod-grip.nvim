title = "dadbod-grip.nvim"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "The DuckDB argv regression uses one synthetic password."
condition = "AND"
regexTarget = "line"
paths = ['''^tests/spec/duckdb_argv_spec\.lua$''']
regexes = ['''local password = "argv_secret_hunter2_7f3c"''']
