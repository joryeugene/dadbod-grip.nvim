name: SQL Server integration

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  sqlserver-2025:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable
      - name: Start SQL Server 2025
        env:
          MSSQL_SA_PASSWORD: "Grip-ci-2025!"
        run: |
          docker run -d --name grip-sqlserver --hostname grip-sqlserver \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            mcr.microsoft.com/mssql/server:2025-latest
          until docker exec -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" grip-sqlserver \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" >/dev/null 2>&1; do
            sleep 3
          done
      - name: Install host sqlcmd wrapper and seed
        env:
          MSSQL_SA_PASSWORD: "Grip-ci-2025!"
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cp tests/fixtures/sqlcmd-docker-wrapper "$RUNNER_TEMP/bin/sqlcmd"
          chmod +x "$RUNNER_TEMP/bin/sqlcmd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" "$RUNNER_TEMP/bin/sqlcmd" \
            -S localhost -U sa -C -Q "IF DB_ID('grip_test') IS NULL CREATE DATABASE grip_test"
          SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" "$RUNNER_TEMP/bin/sqlcmd" \
            -S localhost -U sa -C -d grip_test -i tests/seed_mssql.sql
      - name: Install deterministic database tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3 unzip
      - name: Install pinned DuckDB CLI
        run: |
          curl -fsSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  duckdb.zip" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -q duckdb.zip -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
      - name: Pre-install DuckDB SQLite scanner
        run: |
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/duckdb/duckdb" -c "INSTALL sqlite_scanner; LOAD sqlite_scanner;"; then
              exit 0
            fi
            echo "sqlite_scanner install failed (attempt $attempt of 3)"
            sleep 5
          done
          exit 1
      - name: Run required SQL Server release scenarios
        env:
          GRIP_REQUIRE_DUCKDB: "1"
          GRIP_TEST_LIVE_URL: "sqlserver://sa:Grip-ci-2025!@localhost/grip_test?encrypt=optional&trust_server_certificate=true"
        run: |
          just test-live sqlserver-2025
      - name: Show SQL Server logs on failure
        if: failure()
        run: docker logs grip-sqlserver
      - name: Stop SQL Server
        if: always()
        run: docker rm -f grip-sqlserver >/dev/null 2>&1 || true
