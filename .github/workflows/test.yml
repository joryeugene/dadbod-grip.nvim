name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4 # v1
        with:
          args: lua/ plugin/ lazy.lua tests/

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.10.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3 unzip
      - name: Install pinned DuckDB CLI
        run: |
          curl -fsSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  duckdb.zip" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -q duckdb.zip -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
      - name: Pre-install DuckDB SQLite scanner
        run: |
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/duckdb/duckdb" -c "INSTALL sqlite_scanner; LOAD sqlite_scanner;"; then
              exit 0
            fi
            echo "sqlite_scanner install failed (attempt $attempt of 3)"
            sleep 5
          done
          exit 1
      - name: Run deterministic suite through the documented entry point
        env:
          GRIP_REQUIRE_DUCKDB: "1"
        run: just test

  live:
    name: live (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql-16, mysql-8.4, mariadb-11.8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable
      - name: Install database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 unzip postgresql-client default-mysql-client
          curl -fsSL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  duckdb.zip" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -q duckdb.zip -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
      - name: Start and seed assigned database
        run: |
          case "${{ matrix.database }}" in
            postgresql-16)
              scanner=postgres_scanner
              docker run -d --name grip-live-db -e POSTGRES_PASSWORD=grip \
                -e POSTGRES_DB=grip_test -p 54329:5432 postgres:16-alpine
              until PGPASSWORD=grip psql -h 127.0.0.1 -p 54329 -U postgres \
                -d grip_test -c "SELECT 1" >/dev/null 2>&1; do sleep 2; done
              PGPASSWORD=grip psql -h 127.0.0.1 -p 54329 -U postgres \
                -d grip_test -f tests/seed_pg.sql
              echo "GRIP_TEST_PG_URL=postgresql://postgres:grip@127.0.0.1:54329/grip_test" >> "$GITHUB_ENV"
              echo "GRIP_REQUIRE_POSTGRES=1" >> "$GITHUB_ENV"
              echo "GRIP_TEST_LIVE_URL=postgresql://postgres:grip@127.0.0.1:54329/grip_test" >> "$GITHUB_ENV"
              echo "GRIP_TEST_DUCKDB_FEDERATION_URL=postgresql://postgres:grip@127.0.0.1:54329/grip_test" >> "$GITHUB_ENV"
              ;;
            mysql-8.4)
              scanner=mysql_scanner
              docker run -d --name grip-live-db -e MYSQL_ROOT_PASSWORD=grip \
                -e MYSQL_DATABASE=grip_test -p 33306:3306 mysql:8.4
              until mysql -h 127.0.0.1 -P 33306 -u root -pgrip \
                -e "SELECT 1" >/dev/null 2>&1; do sleep 2; done
              mysql -h 127.0.0.1 -P 33306 -u root -pgrip grip_test < tests/seed_mysql.sql
              echo "GRIP_TEST_MYSQL_URL=mysql://root:grip@127.0.0.1:33306/grip_test" >> "$GITHUB_ENV"
              echo "GRIP_EXPECT_MYSQL_FLAVOR=mysql-8.4" >> "$GITHUB_ENV"
              echo "GRIP_REQUIRE_MYSQL=1" >> "$GITHUB_ENV"
              echo "GRIP_TEST_LIVE_URL=mysql://root:grip@127.0.0.1:33306/grip_test" >> "$GITHUB_ENV"
              echo "GRIP_TEST_DUCKDB_FEDERATION_URL=mysql://root:grip@127.0.0.1:33306/grip_test" >> "$GITHUB_ENV"
              ;;
            mariadb-11.8)
              scanner=mysql_scanner
              docker run -d --name grip-live-db -e MARIADB_ROOT_PASSWORD=grip \
                -e MARIADB_DATABASE=grip_test -p 33306:3306 mariadb:11.8
              until mysql -h 127.0.0.1 -P 33306 -u root -pgrip \
                -e "SELECT 1" >/dev/null 2>&1; do sleep 2; done
              mysql -h 127.0.0.1 -P 33306 -u root -pgrip grip_test < tests/seed_mysql.sql
              echo "GRIP_TEST_MYSQL_URL=mariadb://root:grip@127.0.0.1:33306/grip_test" >> "$GITHUB_ENV"
              echo "GRIP_EXPECT_MYSQL_FLAVOR=mariadb-11.8" >> "$GITHUB_ENV"
              echo "GRIP_REQUIRE_MYSQL=1" >> "$GITHUB_ENV"
              echo "GRIP_TEST_LIVE_URL=mariadb://root:grip@127.0.0.1:33306/grip_test" >> "$GITHUB_ENV"
              echo "GRIP_TEST_DUCKDB_FEDERATION_URL=mariadb://root:grip@127.0.0.1:33306/grip_test" >> "$GITHUB_ENV"
              ;;
          esac
          duckdb -c "INSTALL sqlite_scanner; INSTALL $scanner;"
          echo "GRIP_REQUIRE_LIVE=1" >> "$GITHUB_ENV"
          echo "GRIP_REQUIRE_DUCKDB=1" >> "$GITHUB_ENV"
          echo "GRIP_REQUIRE_DUCKDB_FEDERATION=1" >> "$GITHUB_ENV"
      - name: Run full suite with assigned live database required
        run: just test
      - name: Show database logs on failure
        if: failure()
        run: docker logs grip-live-db
      - name: Stop assigned database
        if: always()
        run: docker rm -f grip-live-db >/dev/null 2>&1 || true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable
      - name: Generate LuaCov report without a percentage gate
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 luarocks
          luarocks --tree "$RUNNER_TEMP/luarocks" --lua-version 5.1 install luacov 0.17.0-1
          eval "$(luarocks --tree "$RUNNER_TEMP/luarocks" --lua-version 5.1 path)"
          GRIP_COVERAGE=1 just test
          "$RUNNER_TEMP/luarocks/bin/luacov"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luacov-report
          path: |
            luacov.report.out
            luacov.stats.out
          if-no-files-found: error
